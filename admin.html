<!DOCTYPE html>
<html lang="en" class="transition-colors duration-1000">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepa Store - Admin Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Cinzel"', 'serif'],
                        mono: ['"Space Mono"', 'monospace'],
                        sans: ['Inter', 'sans-serif'],
                        futuristic: ['"Orbitron"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        .bg-layer { transition: opacity 1.5s ease-in-out; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.3); border-radius: 4px; }
        
        @keyframes popupScale {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-popup-animation {
            animation: popupScale 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="antialiased overflow-x-hidden font-sans select-none text-slate-800 dark:text-slate-200 min-h-screen flex flex-col">

    <!-- Background Gradients -->
    <div id="bg-day" class="bg-layer fixed inset-0 bg-gradient-to-b from-blue-400 to-blue-200 opacity-100 dark:opacity-0 -z-30"></div>
    <div id="bg-night" class="bg-layer fixed inset-0 bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-900 opacity-0 dark:opacity-100 -z-30"></div>

    <!-- MODAL LOGIN ADMIN -->
    <div id="login-modal" onclick="handleOutsideClick(event)" class="fixed inset-0 z-[200] flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
        <div id="login-box" class="bg-white/90 dark:bg-slate-900/95 backdrop-blur-xl w-full max-w-sm rounded-[2.5rem] p-8 shadow-[0_20px_50px_rgba(0,0,0,0.4)] border border-white/20 dark:border-slate-800 font-mono text-center modal-popup-animation relative overflow-hidden">
            
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-sky-500/20 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-indigo-500/20 rounded-full blur-2xl pointer-events-none"></div>

            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 text-white flex items-center justify-center mx-auto mb-4 text-xl shadow-lg shadow-sky-500/30">
                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </div>
            
            <h2 class="text-lg font-bold text-slate-900 dark:text-white mb-1 uppercase tracking-tight font-futuristic">Admin Access</h2>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 mb-6">Autentikasi keamanan Deepa Store.</p>
            
            <form onsubmit="handleLogin(event)" class="space-y-4 text-left text-xs">
                <div>
                    <label class="block font-bold mb-1.5 text-slate-700 dark:text-slate-300 uppercase text-[10px] tracking-wider">Username Admin</label>
                    <input type="text" id="login-username" required autocomplete="off" class="w-full p-3.5 rounded-2xl bg-slate-100/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-sky-500 text-slate-900 dark:text-white text-xs transition-all shadow-inner" placeholder="Masukkan username...">
                </div>
                <div id="login-error" class="text-rose-500 text-[10px] hidden font-bold text-center bg-rose-500/10 py-2 rounded-xl">Lah lu bukan admin ege</div>
                
                <button type="submit" class="w-full py-4 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white font-bold uppercase tracking-widest rounded-2xl shadow-lg shadow-sky-500/25 transition-all">
                    Masuk Dashboard
                </button>
            </form>
        </div>
    </div>

    <!-- PROTECTED DASHBOARD CONTENT -->
    <div id="admin-dashboard-content" class="hidden flex-1 flex flex-col">
        <header class="w-full p-3 sm:p-5 flex justify-between items-center z-50 font-mono text-xs uppercase tracking-widest bg-white/10 dark:bg-black/20 backdrop-blur-md border-b border-white/20 dark:border-white/10">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-sky-500/20 dark:bg-slate-800 text-sky-500 flex items-center justify-center border border-sky-300/30 dark:border-slate-700 shrink-0 shadow-inner">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <div class="hidden sm:block font-futuristic font-bold text-xs tracking-wider text-slate-900 dark:text-white">
                    DEEPA <span class="text-sky-500 font-normal">ADMIN</span>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-4">
                <span id="admin-user-display" class="text-[9px] sm:text-[10px] text-slate-500 dark:text-slate-400 hidden md:inline"></span>
                <button onclick="handleLogout()" class="px-2.5 sm:px-3 py-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 rounded-xl transition-all text-[10px] sm:text-xs">Logout</button>
                <a href="index.html" class="px-3 sm:px-4 py-1.5 sm:py-2 bg-white/20 dark:bg-slate-800/60 hover:bg-white/40 dark:hover:bg-slate-700 rounded-xl transition-all text-slate-900 dark:text-white text-[10px] sm:text-xs">Lihat Toko</a>
            </div>
        </header>

        <main class="flex-1 max-w-5xl w-full mx-auto p-3 sm:p-6 lg:p-8 font-mono">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 mb-6 sm:mb-8">
                <div class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md p-4 sm:p-5 rounded-2xl sm:rounded-3xl border border-white/50 dark:border-slate-800 shadow-xl">
                    <div class="text-[10px] text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Total Produk Aktif</div>
                    <div id="stat-active" class="text-xl sm:text-2xl font-black text-slate-900 dark:text-white">0</div>
                </div>
                <div class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md p-4 sm:p-5 rounded-2xl sm:rounded-3xl border border-white/50 dark:border-slate-800 shadow-xl">
                    <div class="text-[10px] text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Produk Diarsipkan</div>
                    <div id="stat-archived" class="text-xl sm:text-2xl font-black text-rose-500">0</div>
                </div>
                <div class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md p-4 sm:p-5 rounded-2xl sm:rounded-3xl border border-white/50 dark:border-slate-800 shadow-xl flex items-center justify-between">
                    <div>
                        <div class="text-[10px] text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Aksi Cepat</div>
                        <div class="text-xs font-bold text-sky-500">Tambah Produk Baru</div>
                    </div>
                    <button onclick="openProductModal()" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl sm:rounded-2xl bg-sky-500 text-white font-bold text-lg sm:text-xl flex items-center justify-center shadow-lg shadow-sky-500/30 hover:bg-sky-600 transition-all">+</button>
                </div>
            </div>

            <div class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md rounded-[2rem] sm:rounded-[2.5rem] p-4 sm:p-6 shadow-2xl border border-white/50 dark:border-slate-800">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 sm:mb-6 gap-2">
                    <h2 class="text-sm sm:text-lg font-bold text-slate-900 dark:text-white uppercase tracking-tight">Kelola Katalog Produk</h2>
                    <span class="text-[10px] text-slate-500 dark:text-slate-400">Sinkronisasi Otomatis Vercel</span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs whitespace-nowrap sm:whitespace-normal">
                        <thead>
                            <tr class="border-b border-slate-200 dark:border-slate-800 text-slate-400 uppercase tracking-wider text-[10px] sm:text-xs">
                                <th class="pb-3 font-bold">Produk</th>
                                <th class="pb-3 font-bold">Kategori</th>
                                <th class="pb-3 font-bold">Harga Mulai</th>
                                <th class="pb-3 font-bold">Stok</th>
                                <th class="pb-3 font-bold">Status</th>
                                <th class="pb-3 font-bold text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="product-table-body" class="divide-y divide-slate-100 dark:divide-slate-800/60"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL EDIT / TAMBAH PRODUK -->
    <div id="admin-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-3 sm:p-4 hidden">
        <div class="bg-sky-50 dark:bg-slate-900 w-full max-w-md rounded-[2rem] sm:rounded-[2.5rem] p-5 sm:p-8 shadow-2xl border border-sky-200 dark:border-slate-800 relative font-mono max-h-[90vh] overflow-y-auto">
            
            <button onclick="closeProductModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 dark:hover:text-white p-2">✕</button>

            <h3 id="modal-heading" class="text-base sm:text-lg font-bold text-slate-900 dark:text-white mb-4 uppercase tracking-tight">Tambah / Edit Produk</h3>

            <input type="hidden" id="edit-index" value="-1">

            <div class="space-y-3.5 text-xs">
                <div>
                    <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300 uppercase text-[10px]">Nama Produk</label>
                    <input type="text" id="input-name" class="w-full p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-sky-400 text-slate-900 dark:text-white text-xs" placeholder="Contoh: Netflix">
                </div>
                <div>
                    <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300 uppercase text-[10px]">Kategori</label>
                    <input type="text" id="input-category" class="w-full p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-sky-400 text-slate-900 dark:text-white text-xs" placeholder="Contoh: Hiburan">
                </div>
                <div>
                    <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300 uppercase text-[10px]">Harga Mulai (Rp)</label>
                    <input type="number" id="input-price" class="w-full p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-sky-400 text-slate-900 dark:text-white text-xs" placeholder="3000">
                </div>
                <div>
                    <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300 uppercase text-[10px]">Jumlah Stok</label>
                    <input type="number" id="input-stock" class="w-full p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-sky-400 text-slate-900 dark:text-white text-xs" placeholder="10">
                </div>
                <div>
                    <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300 uppercase text-[10px]">Upload Foto Produk</label>
                    <input type="file" id="input-image" accept="image/*" class="w-full p-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 text-[11px]">
                </div>
                <div>
                    <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300 uppercase text-[10px]">Deskripsi Produk</label>
                    <textarea id="input-desc" class="w-full p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-sky-400 text-slate-900 dark:text-white text-xs" rows="3" placeholder="Tuliskan deskripsi produk di sini..."></textarea>
                </div>

                <button onclick="saveProduct()" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold uppercase tracking-widest rounded-xl shadow-lg shadow-emerald-500/30 transition-all mt-2 text-xs">
                    Simpan Perubahan
                </button>
            </div>
        </div>
    </div>

    <script>
        const CORRECT_ADMIN_USER = "edoputra28*";

        window.addEventListener('DOMContentLoaded', () => {
            const loggedAdmin = localStorage.getItem('deepa_admin_user');
            if (loggedAdmin === CORRECT_ADMIN_USER) {
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('admin-dashboard-content').classList.remove('hidden');
                document.getElementById('admin-user-display').textContent = `Admin: ${loggedAdmin}`;
                renderAdminTable();
            } else {
                document.getElementById('login-modal').classList.remove('hidden');
                document.getElementById('admin-dashboard-content').classList.add('hidden');
                localStorage.removeItem('deepa_admin_user');
            }
        });

        function handleOutsideClick(event) {
            const loginBox = document.getElementById('login-box');
            const loggedAdmin = localStorage.getItem('deepa_admin_user');

            if (!loginBox.contains(event.target)) {
                if (loggedAdmin === CORRECT_ADMIN_USER) {
                    document.getElementById('login-modal').classList.add('hidden');
                } else {
                    const errorElement = document.getElementById('login-error');
                    errorElement.textContent = "Harap masukkan username admin yang valid!";
                    errorElement.classList.remove('hidden');
                }
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('login-username').value.trim();
            const errorElement = document.getElementById('login-error');

            if (usernameInput === CORRECT_ADMIN_USER) {
                localStorage.setItem('deepa_admin_user', usernameInput);
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('admin-dashboard-content').classList.remove('hidden');
                document.getElementById('admin-user-display').textContent = `Admin: ${usernameInput}`;
                errorElement.classList.add('hidden');
                renderAdminTable();
            } else {
                localStorage.removeItem('deepa_admin_user');
                errorElement.textContent = "Lah lu bukan admin ege";
                errorElement.classList.remove('hidden');
                document.getElementById('admin-dashboard-content').classList.add('hidden');
                document.getElementById('login-username').value = '';
                document.getElementById('login-username').focus();
            }
        }

        function handleLogout() {
            localStorage.removeItem('deepa_admin_user');
            document.getElementById('login-username').value = '';
            document.getElementById('login-error').classList.add('hidden');
            document.getElementById('admin-dashboard-content').classList.add('hidden');
            document.getElementById('login-modal').classList.remove('hidden');
        }

        function updateTheme() {
            const hour = new Date().getHours();
            if (hour >= 6 && hour < 18) {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        }
        updateTheme();

        let products = JSON.parse(localStorage.getItem('deepa_products')) || [
            { id: 1, name: 'Netflix', category: 'Hiburan', price: 3000, stock: 15, isArchived: false, image: '', desc: 'Streaming film & series favorit dengan kualitas HD/4K.' },
            { id: 2, name: 'Disney+', category: 'Hiburan', price: 3000, stock: 15, isArchived: false, image: '', desc: 'Nonton ribuan film Disney, Pixar, Marvel, & Star Wars sepuasnya.' }
        ];

        function saveToStorage() {
            localStorage.setItem('deepa_products', JSON.stringify(products));
            renderAdminTable();
        }

        function renderAdminTable() {
            const tbody = document.getElementById('product-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';

            let activeCount = 0;
            let archivedCount = 0;

            products.forEach((p, index) => {
                const isOutOfStock = p.stock <= 0;
                const isArchived = p.isArchived || isOutOfStock;

                if (isArchived) archivedCount++;
                else activeCount++;

                const tr = document.createElement('tr');
                tr.className = `border-b border-slate-100 dark:border-slate-800/60 transition-all ${isArchived ? 'opacity-60 bg-rose-50/50 dark:bg-rose-950/10' : ''}`;
                
                let thumbHtml = `<div class="w-9 h-9 rounded-xl bg-sky-100 dark:bg-slate-800 flex items-center justify-center font-bold text-sky-600 text-xs shadow-inner">${p.name.charAt(0)}</div>`;
                if (p.image) {
                    thumbHtml = `<img src="${p.image}" class="w-9 h-9 rounded-xl object-cover shadow-sm border border-slate-200 dark:border-slate-700">`;
                }

                tr.innerHTML = `
                    <td class="py-3 sm:py-4 font-bold text-slate-900 dark:text-white flex items-center gap-3">
                        ${thumbHtml}
                        <div>
                            <div>${p.name}</div>
                            <div class="text-[9px] text-slate-400 font-normal">ID: #DP-${p.id}</div>
                        </div>
                    </td>
                    <td class="py-3 sm:py-4 text-slate-600 dark:text-slate-300">${p.category}</td>
                    <td class="py-3 sm:py-4 font-bold text-pink-500">Rp${p.price.toLocaleString('id-ID')}</td>
                    <td class="py-3 sm:py-4">
                        <span class="px-2.5 py-1 rounded-full text-[9px] sm:text-[10px] font-bold ${p.stock <= 0 ? 'bg-rose-100 text-rose-600 dark:bg-rose-950 dark:text-rose-400' : 'bg-emerald-100 text-emerald-600 dark:bg-emerald-950 dark:text-emerald-400'}">
                            ${p.stock} Unit
                        </span>
                    </td>
                    <td class="py-3 sm:py-4">
                        ${isArchived ? '<span class="text-rose-500 font-bold uppercase text-[9px] sm:text-[10px]">📦 Diarsipkan</span>' : '<span class="text-emerald-500 font-bold uppercase text-[9px] sm:text-[10px]">🟢 Aktif</span>'}
                    </td>
                    <td class="py-3 sm:py-4 text-right space-x-1 sm:space-x-2">
                        <button onclick="toggleArchive(${index})" title="Arsipkan / Aktifkan" class="px-2 py-1.5 bg-amber-100 dark:bg-slate-800 text-amber-600 dark:text-amber-400 rounded-lg hover:bg-amber-200 transition-all text-xs">📦</button>
                        <button onclick="editProduct(${index})" class="px-2.5 py-1.5 bg-sky-100 dark:bg-slate-800 text-sky-600 dark:text-sky-300 rounded-lg hover:bg-sky-200 transition-all text-xs">Edit</button>
                        <button onclick="deleteProduct(${index})" class="px-2.5 py-1.5 bg-rose-100 dark:bg-slate-800 text-rose-600 dark:text-rose-300 rounded-lg hover:bg-rose-200 transition-all text-xs">Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('stat-active').textContent = activeCount;
            document.getElementById('stat-archived').textContent = archivedCount;
        }

        function toggleArchive(index) {
            products[index].isArchived = !products[index].isArchived;
            saveToStorage();
        }

        let currentImageBase64 = '';

        document.getElementById('input-image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    currentImageBase64 = uploadEvent.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function openProductModal(index = -1) {
            document.getElementById('admin-modal').classList.remove('hidden');
            currentImageBase64 = '';
            document.getElementById('input-image').value = '';

            if (index > -1) {
                document.getElementById('modal-heading').textContent = "Edit Produk";
                document.getElementById('edit-index').value = index;
                document.getElementById('input-name').value = products[index].name;
                document.getElementById('input-category').value = products[index].category;
                document.getElementById('input-price').value = products[index].price;
                document.getElementById('input-stock').value = products[index].stock;
                document.getElementById('input-desc').value = products[index].desc || '';
                currentImageBase64 = products[index].image || '';
            } else {
                document.getElementById('modal-heading').textContent = "Tambah Produk Baru";
                document.getElementById('edit-index').value = -1;
                document.getElementById('input-name').value = '';
                document.getElementById('input-category').value = 'Hiburan';
                document.getElementById('input-price').value = '';
                document.getElementById('input-stock').value = '10';
                document.getElementById('input-desc').value = '';
            }
        }

        function closeProductModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function saveProduct() {
            const index = parseInt(document.getElementById('edit-index').value);
            const name = document.getElementById('input-name').value.trim();
            const category = document.getElementById('input-category').value.trim();
            const price = parseInt(document.getElementById('input-price').value) || 0;
            const stock = parseInt(document.getElementById('input-stock').value) || 0;
            const desc = document.getElementById('input-desc').value.trim();

            if (!name) {
                alert('Nama produk wajib diisi!');
                return;
            }

            if (index > -1) {
                products[index] = { 
                    ...products[index], 
                    name, 
                    category, 
                    price, 
                    stock, 
                    desc, 
                    image: currentImageBase64 || products[index].image 
                };
            } else {
                const newId = products.length > 0 ? products[products.length - 1].id + 1 : 1;
                products.push({ 
                    id: newId, 
                    name, 
                    category, 
                    price, 
                    stock, 
                    isArchived: false, 
                    image: currentImageBase64, 
                    desc 
                });
            }

            saveToStorage();
            closeProductModal();
        }

        function editProduct(index) {
            openProductModal(index);
        }

        function deleteProduct(index) {
            if (confirm(`Yakin ingin menghapus produk ${products[index].name}?`)) {
                products.splice(index, 1);
                saveToStorage();
            }
        }
    </script>
</body>
</html>
