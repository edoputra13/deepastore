<!-- CARD LOGIN ADMIN ACCESS -->
<div id="admin-login-card" class="w-full max-w-[360px] mx-auto rounded-[1.75rem] p-6 sm:p-7 bg-gradient-to-br from-slate-50 via-white to-sky-50/80 shadow-2xl border border-white/80 text-center font-mono">
    <!-- Ikon Gembok -->
    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-sky-500 text-white flex items-center justify-center mx-auto mb-4 shadow-lg shadow-sky-500/30">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
    </div>

    <h1 class="font-futuristic font-black text-xl tracking-wider text-slate-900 uppercase mb-1">ADMIN ACCESS</h1>
    <p class="text-[11px] text-slate-500 mb-5">Autentikasi keamanan Deepa Store.</p>

    <form onsubmit="handleAdminLogin(event)" class="space-y-4 text-left">
        <div>
            <label class="block font-bold mb-1.5 text-slate-700 uppercase text-[10px] tracking-widest">USERNAME</label>
            <input type="text" id="admin-username" required autocomplete="off" placeholder="Username kamu" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100/80 border border-slate-200/90 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:bg-white transition-all">
        </div>

        <div>
            <label class="block font-bold mb-1.5 text-slate-700 uppercase text-[10px] tracking-widest">PASSWORD</label>
            <div class="relative">
                <input type="password" id="admin-password" required autocomplete="off" placeholder="Password kamu" class="w-full px-3.5 py-2.5 pr-10 rounded-xl bg-slate-100/80 border border-slate-200/90 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:bg-white transition-all">
                <button type="button" onclick="toggleAdminPasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-sky-600 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                </button>
            </div>
        </div>

        <div id="admin-login-error" class="hidden text-[10px] font-bold text-rose-600 bg-rose-50 border border-rose-200 py-1.5 px-3 rounded-lg text-center"></div>

        <button type="submit" id="admin-login-submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-sky-500 to-indigo-600 hover:brightness-105 text-white font-black uppercase tracking-widest text-[11px] shadow-lg shadow-sky-500/25 transition-all">
            MASUK DASHBOARD
        </button>
    </form>

    <div class="mt-4">
        <button type="button" onclick="openChangeAdminPassModal()" class="text-[11px] font-bold text-sky-600 hover:text-sky-700 hover:underline transition-colors">
            Ubah Password Admin
        </button>
    </div>
</div>
