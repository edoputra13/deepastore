<!-- LOGIN / ADMIN ACCESS CARD -->
        <div id="admin-login-card" class="w-full max-w-[340px] mx-auto bg-gradient-to-b from-white to-sky-50 rounded-[2rem] p-6 sm:p-7 shadow-2xl border border-white/60 text-center font-mono text-slate-900">
            
            <!-- Ikon Gembok -->
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 text-white flex items-center justify-center mx-auto mb-3.5 shadow-lg shadow-sky-500/30">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
            </div>

            <h2 class="text-xl font-black text-slate-900 uppercase tracking-wider font-futuristic mb-1">Admin Access</h2>
            <p class="text-[11px] text-slate-500 mb-5">Autentikasi keamanan Deepa Store.</p>

            <form onsubmit="handleAdminLogin(event)" class="space-y-3.5 text-left">
                <div>
                    <label class="block text-[10px] font-bold text-slate-800 uppercase tracking-widest mb-1">Username</label>
                    <input type="text" id="admin-username" required autocomplete="off" placeholder="Username kamu" class="w-full px-3.5 py-2.5 rounded-xl bg-white border border-slate-200 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-sky-500 transition-colors">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-800 uppercase tracking-widest mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="admin-password" required autocomplete="off" placeholder="Password kamu" class="w-full px-3.5 py-2.5 pr-10 rounded-xl bg-white border border-slate-200 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-sky-500 transition-colors">
                        <button type="button" onclick="toggleAdminPass('admin-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-sky-600 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </button>
                    </div>
                </div>

                <div id="admin-login-error" class="hidden text-rose-600 text-[10px] font-bold text-center bg-rose-50 border border-rose-200 py-1.5 px-2.5 rounded-lg"></div>

                <!-- Baris Tombol: Ikon Kembali (kiri) sejajar dengan MASUK DASHBOARD (kanan) -->
                <div class="pt-1 flex items-center gap-2">
                    <a href="index.html" title="Kembali ke Store" class="w-10 h-10 shrink-0 rounded-xl bg-slate-200/80 hover:bg-slate-300/80 text-slate-700 flex items-center justify-center border border-slate-300/60 transition-all">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                        </svg>
                    </a>

                    <button type="submit" id="admin-login-btn" class="flex-1 h-10 bg-gradient-to-r from-sky-500 to-indigo-600 hover:brightness-105 text-white font-black uppercase tracking-widest rounded-xl text-[11px] shadow-md shadow-sky-500/25 transition-all">
                        MASUK DASHBOARD
                    </button>
                </div>
            </form>

            <div class="mt-4">
                <button type="button" onclick="toggleChangeAdminPass(true)" class="text-[11px] font-bold text-sky-600 hover:underline">
                    Ubah Password Admin
                </button>
            </div>
        </div>
