<!DOCTYPE html>
<html lang="en" class="transition-colors duration-1000">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEEPA STORE</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500&family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Enables manual toggling via the 'dark' class
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Cinzel"', 'serif'],
                        mono: ['"Space Mono"', 'monospace'],
                        sans: ['Inter', 'sans-serif'],
                        futuristic: ['"Orbitron"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Ensuring absolute smooth transitions for the background gradients */
        .bg-layer {
            transition: opacity 1.5s ease-in-out;
        }
        
        /* Bird Flight Animation */
        @keyframes flyRight {
            0% { transform: translateX(-10vw) translateY(0) scale(var(--s, 1)); }
            25% { transform: translateX(20vw) translateY(-3vh) scale(var(--s, 1)); }
            75% { transform: translateX(80vw) translateY(2vh) scale(var(--s, 1)); }
            100% { transform: translateX(110vw) translateY(0) scale(var(--s, 1)); }
        }
        .bird {
            position: fixed;
            animation: flyRight linear infinite;
            z-index: 15;
            pointer-events: none;
            will-change: transform;
        }
        .bird-1 { top: 25%; animation-duration: 25s; animation-delay: 0s; --s: 1; }
        .bird-2 { top: 40%; animation-duration: 35s; animation-delay: -10s; --s: 0.6; }
        .bird-3 { top: 15%; animation-duration: 28s; animation-delay: -15s; --s: 0.8; }
        .bird-4 { top: 30%; animation-duration: 40s; animation-delay: -5s; --s: 0.5; }
        
        /* Loading Screen Split Effect */
        .curtain {
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .curtain-up { transform: translateY(-100%); }
        .curtain-down { transform: translateY(100%); }

        /* Typing cursor */
        .typing-cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background-color: currentColor;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="antialiased overflow-hidden font-sans select-none text-slate-800 dark:text-slate-200">

    <!-- Loading Screen Split Curtains -->
    <div id="loader-top" class="fixed top-0 left-0 w-full h-1/2 bg-black z-[100] curtain flex items-end justify-center pb-1 shadow-2xl">
        <span class="text-white font-futuristic font-bold text-4xl sm:text-5xl tracking-[0.2em] sm:tracking-[0.3em] overflow-hidden translate-y-[50%]">DEEPA</span>
    </div>
    <div id="loader-bottom" class="fixed bottom-0 left-0 w-full h-1/2 bg-black z-[100] curtain flex items-start justify-center pt-1 shadow-2xl">
        <span class="text-white font-futuristic font-bold text-4xl sm:text-5xl tracking-[0.2em] sm:tracking-[0.3em] overflow-hidden -translate-y-[50%]">STORE</span>
    </div>

    <!-- Background Gradients (Crossfading for smooth transitions) -->
    <!-- Day Sky -->
    <div class="bg-layer fixed inset-0 bg-gradient-to-b from-blue-400 to-blue-200 opacity-100 dark:opacity-0 -z-30"></div>
    <!-- Night Sky -->
    <div class="bg-layer fixed inset-0 bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-900 opacity-0 dark:opacity-100 -z-30"></div>

    <!-- Infinite Flying Birds (Scaled for mobile) -->
    <div class="bird bird-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8 md:w-12 md:h-12 text-slate-700 dark:text-slate-300 opacity-70">
            <path d="M2 12c4 -4 8 -4 10 0c2 -4 6 -4 10 0" />
        </svg>
    </div>
    <div class="bird bird-2">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 md:w-10 md:h-10 text-slate-700 dark:text-slate-300 opacity-50">
            <path d="M2 12c4 -4 8 -4 10 0c2 -4 6 -4 10 0" />
        </svg>
    </div>
    <div class="bird bird-3">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-10 h-10 md:w-16 md:h-16 text-slate-700 dark:text-slate-300 opacity-60">
            <path d="M2 12c4 -4 8 -4 10 0c2 -4 6 -4 10 0" />
        </svg>
    </div>
    <div class="bird bird-4">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 md:w-8 md:h-8 text-slate-700 dark:text-slate-300 opacity-40">
            <path d="M2 12c4 -4 8 -4 10 0c2 -4 6 -4 10 0" />
        </svg>
    </div>

    <!-- Header Navigation -->
    <header class="fixed top-0 left-0 w-full p-4 md:p-8 flex justify-between items-center z-50 font-mono text-[10px] md:text-xs uppercase tracking-widest transition-colors duration-1000">
        <!-- Left Section -->
        <div class="hidden lg:block w-1/3 text-left">
            INDONESIA
        </div>
        
        <!-- Center Glassmorphism Nav -->
        <div class="w-full lg:w-1/3 flex justify-center">
            <nav class="flex items-center gap-4 sm:gap-6 md:gap-8 w-full sm:w-auto justify-center bg-white/20 dark:bg-black/20 backdrop-blur-xl border border-white/30 dark:border-white/10 px-6 sm:px-8 py-2 md:py-2.5 rounded-full shadow-[0_8px_32px_0_rgba(31,38,135,0.1)] dark:shadow-[0_8px_32px_0_rgba(0,0,0,0.4)] transition-all duration-1000">
                <!-- Links -->
                <a href="#" class="font-sans text-xs md:text-sm font-medium hover:text-white dark:hover:text-white transition-colors">About</a>
                <a href="#" class="font-sans text-xs md:text-sm font-medium hover:text-white dark:hover:text-white transition-colors">Jajan</a>
                <a href="#" class="font-sans text-xs md:text-sm font-medium hover:text-white dark:hover:text-white transition-colors">Contact</a>
            </nav>
        </div>
        
        <!-- Right Section -->
        <div class="hidden lg:block w-1/3 text-right current-date-display">
            <!-- Date will be injected here -->
        </div>
    </header>

    <!-- Fallback date for mobile -->
    <div class="lg:hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 font-mono text-[9px] uppercase tracking-widest current-date-display opacity-70"></div>

    <!-- Main Content -->
    <main class="relative z-40 flex flex-col items-center justify-center h-full min-h-screen px-4 pointer-events-none">
        
        <!-- Tagline with Typing Effect -->
        <div class="flex items-center gap-1 mb-2 md:mb-4 font-mono text-[10px] sm:text-xs md:text-sm tracking-widest uppercase transition-colors duration-1000 h-6">
            <span id="typing-text"></span><span class="typing-cursor"></span>
        </div>
        
        <!-- Huge Futuristic Heading -->
        <h1 class="font-futuristic font-black text-4xl sm:text-6xl md:text-8xl lg:text-9xl leading-[1.1] text-center text-[#f8fafc] drop-shadow-[0_0_15px_rgba(255,255,255,0.3)] transition-colors duration-1000 tracking-wide sm:tracking-wider">
            DEEPA STORE
        </h1>
        
    </main>

    <!-- Time Logic Script -->
    <script>
        function updateThemeBasedOnTime() {
            // Get current time formatted to Asia/Jakarta (WIB) regardless of local user settings
            const options = { timeZone: 'Asia/Jakarta', hour: 'numeric', hour12: false };
            const formatter = new Intl.DateTimeFormat('en-US', options);
            const parts = formatter.formatToParts(new Date());
            const hourPart = parts.find(p => p.type === 'hour');
            
            let hourInWIB = parseInt(hourPart.value, 10);
            
            // Format fallback (e.g. 24 becomes 0)
            if (hourInWIB === 24) hourInWIB = 0;

            // Day is defined as 6:00 AM (6) to 5:59 PM (17)
            const isDay = hourInWIB >= 6 && hourInWIB < 18;
            
            const htmlElement = document.documentElement;

            if (isDay) {
                htmlElement.classList.remove('dark');
            } else {
                htmlElement.classList.add('dark');
            }

            // Update Dates
            const dateOptions = { timeZone: 'Asia/Jakarta', year: 'numeric', month: 'short', day: 'numeric' };
            const dateString = new Intl.DateTimeFormat('en-US', dateOptions).format(new Date());
            document.querySelectorAll('.current-date-display').forEach(el => {
                el.textContent = dateString.toUpperCase();
            });
        }

        // Run immediately on page load
        updateThemeBasedOnTime();

        // Check and update every minute to ensure accurate transitions
        setInterval(updateThemeBasedOnTime, 60000);

        // Loading Split Effect & Typing Animation
        window.addEventListener('load', () => {
            // Trigger curtain split after 1.5 seconds
            setTimeout(() => {
                document.getElementById('loader-top').classList.add('curtain-up');
                document.getElementById('loader-bottom').classList.add('curtain-down');
                
                // Hide loaders completely after animation to prevent blocking clicks
                setTimeout(() => {
                    document.getElementById('loader-top').style.display = 'none';
                    document.getElementById('loader-bottom').style.display = 'none';
                }, 1200);

                // Start typing effect shortly after curtain opens
                setTimeout(typeWriter, 600);
            }, 1500);
        });

        // Typing Effect Logic
        const textToType = "HELLO, CUSTOMER";
        const typingSpeed = 120; // ms per character
        let typeIndex = 0;

        function typeWriter() {
            if (typeIndex < textToType.length) {
                document.getElementById("typing-text").innerHTML += textToType.charAt(typeIndex);
                typeIndex++;
                setTimeout(typeWriter, typingSpeed);
            }
        }
    </script>
</body>
</html>
