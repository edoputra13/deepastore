<!DOCTYPE html>
<html lang="en" class="transition-colors duration-1000">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satya - Selected Work</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Cinzel"', 'serif'],
                        mono: ['"Space Mono"', 'monospace'],
                        sans: ['Inter', 'sans-serif'],
                        futuristic: ['"Orbitron"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        .bg-layer {
            transition: opacity 1.5s ease-in-out;
        }
        
        /* Bird Flight Animation (Daytime) */
        @keyframes flyRight {
            0% { transform: translateX(-10vw) translateY(0) scale(var(--s, 1)); }
            25% { transform: translateX(20vw) translateY(-3vh) scale(var(--s, 1)); }
            75% { transform: translateX(80vw) translateY(2vh) scale(var(--s, 1)); }
            100% { transform: translateX(110vw) translateY(0) scale(var(--s, 1)); }
        }
        .bird {
            position: fixed;
            animation: flyRight linear infinite;
            z-index: 15;
            pointer-events: none;
            will-change: transform;
        }
        .bird-1 { top: 25%; animation-duration: 25s; animation-delay: 0s; --s: 1; }
        .bird-2 { top: 40%; animation-duration: 35s; animation-delay: -10s; --s: 0.6; }
        .bird-3 { top: 15%; animation-duration: 28s; animation-delay: -15s; --s: 0.8; }
        .bird-4 { top: 30%; animation-duration: 40s; animation-delay: -5s; --s: 0.5; }

        /* Realistic Moon & Twinkling Stars Animation (Nighttime) */
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes moonGlow {
            0%, 100% { box-shadow: 0 0 25px rgba(255, 255, 255, 0.2), inset -12px 6px 15px rgba(0, 0, 0, 0.6); }
            50% { box-shadow: 0 0 40px rgba(255, 255, 255, 0.35), inset -12px 6px 15px rgba(0, 0, 0, 0.6); }
        }

        .night-element {
            position: fixed;
            z-index: 15;
            pointer-events: none;
        }
        .realistic-moon {
            top: 10%;
            right: 12%;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #e2e8f0 60%, #cbd5e1 100%);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.25), inset -14px 8px 18px rgba(0, 0, 0, 0.55);
            animation: moonGlow 4s ease-in-out infinite;
        }
        .realistic-moon::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 20px;
            width: 14px;
            height: 14px;
            background: rgba(0, 0, 0, 0.12);
            border-radius: 50%;
            box-shadow: 18px 20px 0 -2px rgba(0, 0, 0, 0.1), 8px 30px 0 -4px rgba(0, 0, 0, 0.08);
        }

        .star-1 { top: 20%; left: 15%; animation: twinkle 3s ease-in-out infinite; }
        .star-2 { top: 35%; left: 75%; animation: twinkle 2.2s ease-in-out infinite 0.5s; }
        .star-3 { top: 15%; left: 45%; animation: twinkle 4s ease-in-out infinite 1s; }
        .star-4 { top: 60%; left: 25%; animation: twinkle 2.8s ease-in-out infinite 0.3s; }
        .star-5 { top: 50%; left: 85%; animation: twinkle 3.5s ease-in-out infinite 1.5s; }
        
        /* Loading Screen Split Effect */
        .curtain {
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .curtain-up { transform: translateY(-100%); }
        .curtain-down { transform: translateY(100%); }

        /* Typing cursor */
        .typing-cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background-color: currentColor;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Navbar & Button Animations */
        @keyframes navPulse {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); box-shadow: 0 0 25px rgba(255, 255, 255, 0.5); }
            100% { transform: scale(1); }
        }
        .nav-clicked {
            animation: navPulse 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes linkRipple {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); color: #38bdf8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .link-clicked {
            animation: linkRipple 0.3s ease-in-out;
        }

        /* Smooth View Transition & Background Depth Effect */
        .view-section {
            transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
        }
        .view-enter {
            opacity: 0;
            transform: translateY(15px);
        }
        .view-enter-active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(150, 150, 150, 0.3);
            border-radius: 4px;
        }
    </style>
</head>

                            <div class="text-[11px] font-mono text-slate-500 dark:text-slate-400 tracking-wider">Mulai <span class="font-bold text-slate-900 dark:text-white">Rp5.000</span></div>

    <!-- Time Logic & Page Switcher Script -->
    <script>
        function updateThemeBasedOnTime() {
            const options = { timeZone: 'Asia/Jakarta', hour: 'numeric', hour12: false };
            const formatter = new Intl.DateTimeFormat('en-US', options);
            const parts = formatter.formatToParts(new Date());
            const hourPart = parts.find(p => p.type === 'hour');
            
            let hourInWIB = parseInt(hourPart.value, 10);
            if (hourInWIB === 24) hourInWIB = 0;

            const isDay = hourInWIB >= 6 && hourInWIB < 18;
            const htmlElement = document.documentElement;

            if (isDay) {
                htmlElement.classList.remove('dark');
            } else {
                htmlElement.classList.add('dark');
            }

            const dateOptions = { timeZone: 'Asia/Jakarta', year: 'numeric', month: 'short', day: 'numeric' };
            const dateString = new Intl.DateTimeFormat('en-US', dateOptions).format(new Date());
            document.querySelectorAll('.current-date-display').forEach(el => {
                el.textContent = dateString.toUpperCase();
            });
        }

        updateThemeBasedOnTime();
        setInterval(updateThemeBasedOnTime, 60000);

        // Loading Curtain Effect
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader-top').classList.add('curtain-up');
                document.getElementById('loader-bottom').classList.add('curtain-down');
                
                setTimeout(() => {
                    document.getElementById('loader-top').style.display = 'none';
                    document.getElementById('loader-bottom').style.display = 'none';
                }, 1200);

                setTimeout(typeWriter, 600);
            }, 1500);
        });

        // Typing Effect Logic
        const textToType = "HELLO, CUSTOMER";
        const typingSpeed = 120;
        let typeIndex = 0;

        function typeWriter() {
            if (typeIndex < textToType.length) {
                document.getElementById("typing-text").innerHTML += textToType.charAt(typeIndex);
                typeIndex++;
                setTimeout(typeWriter, typingSpeed);
            }
        }

        // Smooth Page Switcher Logic with Ambient Glow Transition
        function switchView(viewName) {
            const homeView = document.getElementById('home-view');
            const jajanView = document.getElementById('jajan-view');
            const navLinks = document.querySelectorAll('.nav-link');
            const ambientGlow = document.getElementById('jajan-ambient-glow');

            navLinks.forEach(link => link.classList.remove('text-sky-400', 'font-semibold'));

            // Fade out current active view
            const activeView = !homeView.classList.contains('hidden') ? homeView : jajanView;
            activeView.style.opacity = '0';
            activeView.style.transform = 'translateY(-10px)';

            setTimeout(() => {
                homeView.classList.add('hidden');
                jajanView.classList.add('hidden');

                if (viewName === 'jajan') {
                    jajanView.classList.remove('hidden');
                    navLinks[1].classList.add('text-sky-400', 'font-semibold');
                    ambientGlow.style.opacity = '1'; // Smooth ambient glow on
                } else {
                    homeView.classList.remove('hidden');
                    navLinks[0].classList.add('text-sky-400', 'font-semibold');
                    ambientGlow.style.opacity = '0'; // Ambient glow off
                }

                // Fade in target view smoothly
                const targetView = viewName === 'jajan' ? jajanView : homeView;
                targetView.style.opacity = '0';
                targetView.style.transform = 'translateY(15px)';
                
                setTimeout(() => {
                    targetView.style.transition = 'opacity 0.5s ease-in-out, transform 0.5s ease-in-out';
                    targetView.style.opacity = '1';
                    targetView.style.transform = 'translateY(0)';
                }, 50);

            }, 300);
        }

        // Navbar Animation Effects
        const navContainer = document.getElementById('main-nav');
        navContainer.addEventListener('click', () => {
            navContainer.classList.remove('nav-clicked');
            void navContainer.offsetWidth;
            navContainer.classList.add('nav-clicked');
        });

        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.stopPropagation();
                navLinks.forEach(l => l.classList.remove('link-clicked'));
                void link.offsetWidth;
                link.classList.add('link-clicked');
            });
        });
    </script>
</body>
</html>
