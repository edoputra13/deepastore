    <style>
        .bg-layer { transition: opacity 1.5s ease-in-out; }
        
        @keyframes flyRight {
            0% { transform: translateX(-10vw) translateY(0) scale(var(--s, 1)); }
            25% { transform: translateX(20vw) translateY(-3vh) scale(var(--s, 1)); }
            75% { transform: translateX(80vw) translateY(2vh) scale(var(--s, 1)); }
            100% { transform: translateX(110vw) translateY(0) scale(var(--s, 1)); }
        }
        .bird {
            position: fixed;
            animation: flyRight linear infinite;
            z-index: 15;
            pointer-events: none;
            will-change: transform;
        }
        .bird-1 { top: 25%; animation-duration: 25s; animation-delay: 0s; --s: 1; }
        .bird-2 { top: 40%; animation-duration: 35s; animation-delay: -10s; --s: 0.6; }
        .bird-3 { top: 15%; animation-duration: 28s; animation-delay: -15s; --s: 0.8; }
        .bird-4 { top: 30%; animation-duration: 40s; animation-delay: -5s; --s: 0.5; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes moonGlow {
            0%, 100% { box-shadow: 0 0 25px rgba(255, 255, 255, 0.2), inset -12px 6px 15px rgba(0, 0, 0, 0.6); }
            50% { box-shadow: 0 0 40px rgba(255, 255, 255, 0.35), inset -12px 6px 15px rgba(0, 0, 0, 0.6); }
        }

        .night-element { position: fixed; z-index: 15; pointer-events: none; }
        .realistic-moon {
            top: 10%; right: 12%; width: 70px; height: 70px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #e2e8f0 60%, #cbd5e1 100%);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.25), inset -14px 8px 18px rgba(0, 0, 0, 0.55);
            animation: moonGlow 4s ease-in-out infinite;
        }
        .realistic-moon::after {
            content: ''; position: absolute; top: 15px; left: 20px; width: 14px; height: 14px;
            background: rgba(0, 0, 0, 0.12); border-radius: 50%;
            box-shadow: 18px 20px 0 -2px rgba(0, 0, 0, 0.1), 8px 30px 0 -4px rgba(0, 0, 0, 0.08);
        }

        .star-1 { top: 20%; left: 15%; animation: twinkle 3s ease-in-out infinite; }
        .star-2 { top: 35%; left: 75%; animation: twinkle 2.2s ease-in-out infinite 0.5s; }
        .star-3 { top: 15%; left: 45%; animation: twinkle 4s ease-in-out infinite 1s; }
        .star-4 { top: 60%; left: 25%; animation: twinkle 2.8s ease-in-out infinite 0.3s; }
        .star-5 { top: 50%; left: 85%; animation: twinkle 3.5s ease-in-out infinite 1.5s; }
        
        .curtain { transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1); }
        .curtain-up { transform: translateY(-100%); }
        .curtain-down { transform: translateY(100%); }

        .typing-cursor {
            display: inline-block; width: 8px; height: 1.2em;
            background-color: currentColor; vertical-align: middle;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .view-section { transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out; }

        .modal-enter { opacity: 0; transform: scale(0.95) translateY(10px); }
        .modal-enter-active {
            opacity: 1; transform: scale(1) translateY(0);
            transition: opacity 0.3s ease-out, transform 0.3s ease-out;
        }

        .futuristic-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }
        .dark .futuristic-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(56, 189, 248, 0.1);
        }

        .platform-item {
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .platform-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent, rgba(56, 189, 248, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }
        .platform-item:hover::before {
            transform: translateX(100%);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.3); border-radius: 4px; }

    <div id="product-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 hidden">
        <div id="modal-box" class="bg-sky-50 dark:bg-slate-900 w-full max-w-lg rounded-[2.5rem] sm:rounded-[3rem] p-6 sm:p-8 shadow-2xl border border-sky-200 dark:border-slate-800 relative font-mono modal-enter max-h-[90vh] overflow-y-auto">
            
            <button onclick="closeProductModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-700 dark:hover:text-white transition-colors p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <div class="flex items-center gap-4 mb-4">
                <div id="modal-icon-container" class="w-16 h-16 shrink-0 bg-white dark:bg-slate-800 rounded-2xl shadow-md flex items-center justify-center overflow-hidden border border-sky-100 dark:border-slate-700"></div>
                <div>
                    <h3 id="modal-title" class="font-mono font-bold text-2xl text-slate-900 dark:text-white tracking-tight">Netflix</h3>
                    <span id="modal-category" class="inline-block bg-sky-200/70 dark:bg-sky-950 text-sky-700 dark:text-sky-300 text-[10px] font-mono uppercase px-2.5 py-0.5 rounded-full my-1 tracking-wider">Hiburan</span>
                </div>
            </div>

            <p id="modal-desc" class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 mb-6 leading-relaxed"></p>

            <div class="mb-5">
                <label class="block text-xs font-bold text-slate-800 dark:text-slate-200 uppercase tracking-widest mb-2.5">Pilih Paket</label>
                <div id="packet-options" class="flex flex-wrap gap-2.5">
                    <button class="packet-btn px-5 py-2 text-xs font-bold rounded-full border border-pink-400 bg-pink-400 text-white shadow-md cursor-default">1P 1U</button>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-xs font-bold text-slate-800 dark:text-slate-200 uppercase tracking-widest mb-2.5">Pilih Durasi</label>
                <div id="duration-options" class="flex flex-wrap gap-2.5">
                    <button onclick="selectDuration('1 Hari', 3000, this)" class="duration-btn px-4 py-2 text-xs font-bold rounded-full border border-pink-400 bg-pink-400 text-white shadow-md transition-all">1 Hari</button>
                    <button onclick="selectDuration('3 Hari', 6000, this)" class="duration-btn px-4 py-2 text-xs font-bold rounded-full border border-sky-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:border-sky-400 transition-all">3 Hari</button>
                    <button onclick="selectDuration('7 Hari', 12000, this)" class="duration-btn px-4 py-2 text-xs font-bold rounded-full border border-sky-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:border-sky-400 transition-all">7 Hari</button>
                </div>
            </div>

            <div class="bg-pink-100/70 dark:bg-slate-800/80 border border-pink-200 dark:border-slate-700 rounded-2xl p-4 flex items-center justify-between mb-6 shadow-sm">
                <span class="text-sm font-bold text-slate-800 dark:text-slate-200 uppercase tracking-wider">Harga</span>
                <span id="modal-price" class="text-xl sm:text-2xl font-black text-pink-500 dark:text-pink-400 tracking-tight">Rp3.000</span>
            </div>

            <div>
                <button onclick="buyViaWhatsApp()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-mono font-bold text-xs uppercase tracking-widest rounded-2xl shadow-lg shadow-emerald-500/30 flex items-center justify-center gap-2 transition-all">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                    Beli Langsung via WhatsApp
                </button>
            </div>

        </div>
    </div>

    <!-- Script Utama -->
    <script>
        const NEON_DATA_API_URL = "https://ep-billowing-shadow-bbbzzr6h.apirest.c-15.us-east-1.aws.neon.tech/neondb/rest/v1";
        const apiHeaders = {
            "Content-Type": "application/json",
            "Prefer": "return=representation"
        };

        function updateThemeBasedOnTime() {
            const options = { timeZone: 'Asia/Jakarta', hour: 'numeric', hour12: false };
            const formatter = new Intl.DateTimeFormat('en-US', options);
            const parts = formatter.formatToParts(new Date());
            const hourPart = parts.find(p => p.type === 'hour');
            
            let hourInWIB = parseInt(hourPart.value, 10);
            if (hourInWIB === 24) hourInWIB = 0;

            const isDay = hourInWIB >= 6 && hourInWIB < 18;
            const htmlElement = document.documentElement;

            if (isDay) htmlElement.classList.remove('dark');
            else htmlElement.classList.add('dark');

            const dateOptions = { timeZone: 'Asia/Jakarta', year: 'numeric', month: 'short', day: 'numeric' };
            const dateString = new Intl.DateTimeFormat('en-US', dateOptions).format(new Date());
            document.querySelectorAll('.current-date-display').forEach(el => {
                el.textContent = dateString.toUpperCase();
            });
        }

        updateThemeBasedOnTime();
        setInterval(updateThemeBasedOnTime, 60000);

        window.addEventListener('load', () => {
            fetchAndRenderProducts(); 
            setTimeout(() => {
                document.getElementById('loader-top').classList.add('curtain-up');
                document.getElementById('loader-bottom').classList.add('curtain-down');
                
                setTimeout(() => {
                    document.getElementById('loader-top').style.display = 'none';
                    document.getElementById('loader-bottom').style.display = 'none';
                }, 1200);

                setTimeout(typeWriter, 600);
            }, 1500);
        });

        async function fetchAndRenderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = `<div class="col-span-2 text-center text-xs text-slate-400 py-12">Memuat katalog dari Neon Data API...</div>`;

            let products = [];
            try {
                const response = await fetch(`${NEON_DATA_API_URL}/products?select=*`, {
                    method: "GET",
                    headers: apiHeaders
                });
                if (!response.ok) throw new Error('Gagal mengambil data dari Neon Data API');
                products = await response.json();
            } catch (error) {
                console.warn('Gagal memuat API, menggunakan fallback lokal:', error);
                products = JSON.parse(localStorage.getItem('deepa_products')) || [
                    { id: 1, name: 'Netflix', category: 'Hiburan', price: 3000, stock: 15, isArchived: false, image: '', desc: 'Streaming film & series favorit dengan kualitas HD/4K.' },
                    { id: 2, name: 'Disney+', category: 'Hiburan', price: 3000, stock: 15, isArchived: false, image: '', desc: 'Nonton ribuan film Disney, Pixar, Marvel, & Star Wars sepuasnya.' }
                ];
            }

            grid.innerHTML = '';
            const activeProducts = products.filter(p => p.stock > 0 && !p.isArchived);

            if (activeProducts.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center text-xs text-slate-400 py-12">Belum ada produk aktif atau semua produk sedang diarsipkan.</div>`;
                return;
            }

            activeProducts.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white/90 dark:bg-slate-900/90 backdrop-blur-md rounded-[1.75rem] p-4 sm:p-5 shadow-xl relative flex flex-col justify-between border border-white/50 dark:border-slate-800 transition-all duration-300 hover:-translate-y-1";
                
                let mediaHTML = `<span class="font-bold text-sky-600 text-lg">${p.name.charAt(0)}</span>`;
                let mediaContainerClass = "w-12 h-12 sm:w-14 sm:h-14 shrink-0 bg-sky-100 dark:bg-slate-800 rounded-xl shadow-md flex items-center justify-center p-0 overflow-hidden border border-slate-200 dark:border-slate-700";
                
                if (p.image) {
                    mediaHTML = `<img src="${p.image}" class="w-full h-full object-cover">`;
                }

                card.innerHTML = `
                    <div class="absolute top-3 right-4 text-amber-400 text-sm">★</div>
                    
                    <div class="flex items-center gap-3.5 mb-4">
                        <div class="${mediaContainerClass}">
                            ${mediaHTML}
                        </div>
                        <div>
                            <h3 class="font-mono font-bold text-base sm:text-lg text-slate-900 dark:text-white tracking-tight leading-snug">${p.name}</h3>
                            <span class="inline-block bg-sky-100 dark:bg-sky-950 text-sky-600 dark:text-sky-300 text-[9px] font-mono uppercase px-2 py-0.5 rounded-full my-0.5 tracking-wider">${p.category}</span>
                            <div class="text-[11px] font-mono text-slate-500 dark:text-slate-400 tracking-wider">Mulai <span class="font-bold text-slate-900 dark:text-white">Rp${Number(p.price).toLocaleString('id-ID')}</span></div>
                        </div>
                    </div>

                    <button onclick='openProductModal(${JSON.stringify(p)})' class="w-full py-2.5 sm:py-3 bg-sky-200 hover:bg-sky-300 dark:bg-sky-950/70 dark:hover:bg-sky-900 text-sky-900 dark:text-sky-200 font-mono font-bold text-[11px] uppercase tracking-widest rounded-xl flex items-center justify-center gap-2 transition-colors">
                        Pilih Varian 
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        const textToType = "HELLO, CUSTOMER";
        const typingSpeed = 120;
        let typeIndex = 0;

        function typeWriter() {
            if (typeIndex < textToType.length) {
                document.getElementById("typing-text").innerHTML += textToType.charAt(typeIndex);
                typeIndex++;
                setTimeout(typeWriter, typingSpeed);
            }
        }

        function switchView(viewName) {
            if (viewName === 'jajan') fetchAndRenderProducts(); 

            const homeView = document.getElementById('home-view');
            const jajanView = document.getElementById('jajan-view');
            const contactView = document.getElementById('contact-view');
            const navLinks = document.querySelectorAll('.nav-link');
            const ambientGlow = document.getElementById('ambient-glow');

            navLinks.forEach(link => link.classList.remove('text-sky-400', 'font-semibold'));

            let activeView = homeView;
            if (!jajanView.classList.contains('hidden')) activeView = jajanView;
            if (!contactView.classList.contains('hidden')) activeView = contactView;

            activeView.style.opacity = '0';
            activeView.style.transform = 'translateY(-10px)';

            setTimeout(() => {
                homeView.classList.add('hidden');
                jajanView.classList.add('hidden');
                contactView.classList.add('hidden');

                if (viewName === 'jajan') {
                    jajanView.classList.remove('hidden');
                    navLinks[1].classList.add('text-sky-400', 'font-semibold');
                    ambientGlow.style.opacity = '1';
                } else if (viewName === 'contact') {
                    contactView.classList.remove('hidden');
                    navLinks[2].classList.add('text-sky-400', 'font-semibold');
                    ambientGlow.style.opacity = '1';
                } else {
                    homeView.classList.remove('hidden');
                    navLinks[0].classList.add('text-sky-400', 'font-semibold');
                    ambientGlow.style.opacity = '0';
                }

                let targetView = homeView;
                if (viewName === 'jajan') targetView = jajanView;
                if (viewName === 'contact') targetView = contactView;

                targetView.style.opacity = '0';
                targetView.style.transform = 'translateY(15px)';
                
                setTimeout(() => {
                    targetView.style.transition = 'opacity 0.5s ease-in-out, transform 0.5s ease-in-out';
                    targetView.style.opacity = '1';
                    targetView.style.transform = 'translateY(0)';
                }, 50);

            }, 300);
        }

        let selectedProductData = {
            name: 'Netflix',
            packet: '1P 1U',
            duration: '1 Hari',
            price: 'Rp3.000',
            rawPrice: 3000
        };

        function openProductModal(product) {
            selectedProductData.name = product.name;
            document.getElementById('modal-title').textContent = product.name;
            document.getElementById('modal-category').textContent = product.category;
            document.getElementById('modal-desc').textContent = product.desc || 'Tidak ada deskripsi produk.';

            const initialPrice = product.price || 3000;
            selectedProductData.duration = '1 Hari';
            selectedProductData.rawPrice = initialPrice;
            selectedProductData.price = "Rp" + Number(initialPrice).toLocaleString('id-ID');
            document.getElementById('modal-price').textContent = selectedProductData.price;

            const durationContainer = document.getElementById('duration-options');
            durationContainer.innerHTML = `
                <button onclick="selectDuration('1 Hari', ${initialPrice}, this)" class="duration-btn px-4 py-2 text-xs font-bold rounded-full border border-pink-400 bg-pink-400 text-white shadow-md transition-all">1 Hari</button>
                <button onclick="selectDuration('3 Hari', ${initialPrice * 2}, this)" class="duration-btn px-4 py-2 text-xs font-bold rounded-full border border-sky-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:border-sky-400 transition-all">3 Hari</button>
                <button onclick="selectDuration('7 Hari', ${initialPrice * 4}, this)" class="duration-btn px-4 py-2 text-xs font-bold rounded-full border border-sky-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:border-sky-400 transition-all">7 Hari</button>
            `;

            const iconContainer = document.getElementById('modal-icon-container');
            if (product.image) {
                iconContainer.innerHTML = `<img src="${product.image}" class="w-full h-full object-cover">`;
            } else {
                iconContainer.innerHTML = `<span class="font-bold text-lg text-sky-600">${product.name.charAt(0)}</span>`;
            }

            const modal = document.getElementById('product-modal');
            const modalBox = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            modalBox.classList.add('modal-enter-active');
        }

        function closeProductModal() {
            const modal = document.getElementById('product-modal');
            modal.classList.add('hidden');
        }

        function selectDuration(durationName, priceValue, btn) {
            document.querySelectorAll('.duration-btn').forEach(b => {
                b.className = "duration-btn px-4 py-2 text-xs font-bold rounded-full border border-sky-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:border-sky-400 transition-all";
            });
            btn.className = "duration-btn px-4 py-2 text-xs font-bold rounded-full border border-pink-400 bg-pink-400 text-white shadow-md transition-all";

            selectedProductData.duration = durationName;
            selectedProductData.rawPrice = priceValue;
            
            const formattedPrice = "Rp" + Number(priceValue).toLocaleString('id-ID');
            selectedProductData.price = formattedPrice;

            document.getElementById('modal-price').textContent = formattedPrice;
        }

        function buyViaWhatsApp() {
            const phoneNumber = "6281717622225"; 
            const message = `Halo Deepa Store, saya ingin memesan:\n\n*Produk:* ${selectedProductData.name}\n*Paket:* ${selectedProductData.packet}\n*Durasi:* ${selectedProductData.duration}\n*Total Harga:* ${selectedProductData.price}\n\nMohon proses pesanan saya. Terima kasih!`;
            const encoded = encodeURIComponent(message);
            window.open(`https://wa.me/${phoneNumber}?text=${encoded}`, '_blank');
            closeProductModal();
        }

        window.onclick = function(event) {
            const modal = document.getElementById('product-modal');
            if (event.target === modal) {
                closeProductModal();
            }
        }
    </script>
</body>
</html>
